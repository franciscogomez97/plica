# Sitio de Plica en el VPS: /etc/nginx/sites-available/plica (enlazado en sites-enabled).
# Por IP y HTTP de momento; al poner dominio: server_name, certbot y listen 443.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/plica/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;   # logos de club (LogoClub los reduce a WebP)

    access_log /var/log/nginx/plica.access.log;
    error_log  /var/log/nginx/plica.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Estáticos con caché larga. Si no existen en disco, a Laravel: Livewire sirve
    # su JS (/livewire-xxxx/livewire.min.js) por ruta, no como fichero.
    location ~* \.(?:css|js|webp|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* { deny all; }
}

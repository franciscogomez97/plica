# Sitio de Plica en el VPS: /etc/nginx/sites-available/plica (enlazado en sites-enabled).
# Dominio plicapesca.es con certificado de Let's Encrypt (certbot, webroot en
# /var/www/letsencrypt; renovación automática por certbot.timer). Todo lo que no sea
# https://plicapesca.es (HTTP, www, la IP desnuda) redirige allí para que ningún
# enlace compartido por WhatsApp lleve otra cosa. Nginx 1.24: «listen ... http2».

# HTTP → HTTPS (default_server: también las peticiones por IP)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name plicapesca.es www.plicapesca.es;

    # Reto de Let's Encrypt (renovaciones): se sirve tal cual, sin redirigir.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://plicapesca.es$request_uri;
    }
}

# www → sin www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.plicapesca.es;

    ssl_certificate     /etc/letsencrypt/live/plicapesca.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plicapesca.es/privkey.pem;

    return 301 https://plicapesca.es$request_uri;
}

# Plica
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name plicapesca.es;
    root /var/www/plica/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;   # logos de club (LogoClub los reduce a WebP)

    ssl_certificate     /etc/letsencrypt/live/plicapesca.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plicapesca.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/plica.access.log;
    error_log  /var/log/nginx/plica.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Estáticos con caché larga. Si no existen en disco, a Laravel: Livewire sirve
    # su JS (/livewire-xxxx/livewire.min.js) por ruta, no como fichero.
    location ~* \.(?:css|js|webp|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
